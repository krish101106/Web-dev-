<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Insta Follow Checker</title>
<style>
  * { box-sizing: border-box; }

  body {
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: #fafafa;
    color: #262626;
    display: flex;
    justify-content: center;
    padding: 40px 16px;
  }

  .card {
    background: #fff;
    border: 1px solid #dbdbdb;
    border-radius: 12px;
    padding: 32px;
    width: 100%;
    max-width: 480px;
  }

  h1 {
    font-size: 20px;
    margin: 0 0 4px;
  }

  p.subtitle {
    color: #737373;
    font-size: 14px;
    margin: 0 0 24px;
  }

  .field {
    margin-bottom: 16px;
  }

  label {
    display: block;
    font-size: 13px;
    font-weight: 600;
    margin-bottom: 6px;
  }

  input[type="file"] {
    width: 100%;
    font-size: 13px;
    padding: 8px;
    border: 1px solid #dbdbdb;
    border-radius: 8px;
    background: #fafafa;
  }

  button {
    width: 100%;
    padding: 10px;
    margin-top: 8px;
    background: #0095f6;
    color: #fff;
    border: none;
    border-radius: 8px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
  }

  button:hover {
    background: #1877f2;
  }

  button:disabled {
    background: #b2dffc;
    cursor: not-allowed;
  }

  .results {
    margin-top: 24px;
  }

  .section {
    margin-bottom: 20px;
  }

  .section h2 {
    font-size: 14px;
    margin: 0 0 8px;
  }

  .count {
    display: inline-block;
    background: #efefef;
    border-radius: 999px;
    padding: 2px 10px;
    font-size: 12px;
    font-weight: 600;
    margin-left: 6px;
  }

  ul {
    list-style: none;
    margin: 0;
    padding: 0;
    max-height: 180px;
    overflow-y: auto;
    border: 1px solid #efefef;
    border-radius: 8px;
  }

  li {
    padding: 8px 12px;
    font-size: 13px;
    border-bottom: 1px solid #efefef;
  }

  li:last-child {
    border-bottom: none;
  }

  .empty {
    color: #737373;
    font-size: 13px;
    padding: 10px 0;
  }

  .download-btn {
    background: #262626;
    margin-top: 6px;
  }

  .download-btn:hover {
    background: #000;
  }
</style>
</head>
<body>

<div class="card">
  <h1>Insta Follow Checker</h1>
  <p class="subtitle">Upload your follower.json and following.json to compare</p>

  <div class="field">
    <label for="followerFile">Followers file</label>
    <input type="file" id="followerFile" accept=".json">
  </div>

  <div class="field">
    <label for="followingFile">Following file</label>
    <input type="file" id="followingFile" accept=".json">
  </div>

  <button id="runBtn" disabled>Compare</button>

  <div class="results" id="results" style="display:none;">
    <div class="section">
      <h2>Mutuals <span class="count" id="mutualCount">0</span></h2>
      <ul id="mutualList"></ul>
      <button class="download-btn" id="downloadMutuals">Download mutuals.json</button>
    </div>

    <div class="section">
      <h2>Not following back <span class="count" id="notFollowingCount">0</span></h2>
      <ul id="notFollowingList"></ul>
      <button class="download-btn" id="downloadNotFollowing">Download notFollowingBack.json</button>
    </div>
  </div>
</div>

<script src="instaFollow.js"></script>
</body>
</html>
