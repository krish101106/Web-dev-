<!DOCTYPE html>
<html lang="en">
<head>

</head>
<body>

    <div class="login">

        <h1>Login to Your Account</h1>

        <div class="form">
            
            <form action="cinemize.html" method="POST">

                <input type="password" name="password" placeholder="Password" required>

            <p>Don't have an account? <a href="register.html">Register</a></p>
            </div>
        
    </div>
    
</body>
